<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industrial Program Library</title><link rel="stylesheet" href="assets/style.css"></head><body><main><header><h1>Industrial Program Library</h1><p>Series → Model → HMI / PLC → Version</p></header><section class="panel"><h2>Connect to private storage</h2><form id="auth"><label>GitHub access token<input id="token" type="password" autocomplete="off" required placeholder="Fine-grained token (never shared)"></label><label><input id="admin" type="checkbox"> Admin publishing mode (requires Contents: Read and write)</label><button>Connect</button><button type="button" id="disconnect">Disconnect</button></form><p id="status" role="status"></p></section><section id="uploader" class="panel" hidden><h2>Upload new version</h2><form id="upload"><div class="grid"><label>Series<select id="series" required><option>M</option><option>5M</option><option>I</option><option>Ir</option><option>MMD</option></select></label><label>Model<input id="model" required placeholder="1W+1S" pattern="[0-9]+W\+[0-9]+S" value="1W+1S"></label><label>Program type<select id="kind"><option>HMI</option><option>PLC</option></select></label><label>Version<input id="version" required placeholder="1.0.0" pattern="[0-9]+\.[0-9]+\.[0-9]+"></label></div><label>Upload comments<textarea id="comments" required rows="4" placeholder="Changes in this version"></textarea></label><label>Archive<input id="archive" type="file" required accept=".zip,.rar,.7z,.tar,.gz,.tgz,.bz2,.xz"></label><button id="uploadBtn">Upload Program</button><p id="uploadStatus" role="status"></p></form></section><section class="panel"><h2>Program releases</h2><div class="grid"><label>Search<input id="search" placeholder="Series, model, version, comments"></label><label>Program type<select id="filter"><option value="">All</option><option>HMI</option><option>PLC</option></select></label></div><button id="refresh" type="button">Refresh releases</button><div id="releases"></div></section><footer>Private GitHub release assets • Never share personal access tokens</footer></main><script src="assets/app.js"></script></body></html>
