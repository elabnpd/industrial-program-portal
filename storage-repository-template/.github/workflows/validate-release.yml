name: Validate program release
on:
  release:
    types: [published, edited]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check release metadata and attachments
        env:
          BODY: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
          ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: |
          python3 - <<'PY'
          import os, re, json, sys
          body=os.environ.get('BODY','')
          fields=dict((m.group(1).lower(),m.group(2).strip()) for m in re.finditer(r'^(Program-ID|Program-Name|Manufacturer|Program-Type|Version|Upload-Comments):\s*(.+)$',body,re.M|re.I))
          required=['program-id','program-name','manufacturer','program-type','version','upload-comments']
          missing=[x for x in required if not fields.get(x)]
          if missing:sys.exit('Missing required release fields: '+', '.join(missing))
          if fields.get('program-type') not in ('HMI','PLC'):sys.exit('Program-Type must be HMI or PLC')
          if fields.get('manufacturer') not in ('Kinco','INVT','Other'):sys.exit('Manufacturer must be Kinco, INVT, or Other')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]{1,63}',fields.get('program-id','')):sys.exit('Invalid Program-ID')
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?',fields.get('version','')):sys.exit('Use semantic version format 1.2.0')
          expected=fields['program-id']+'-v'+fields['version']
          if os.environ.get('TAG')!=expected:sys.exit('Tag must be '+expected)
          assets=json.loads(os.environ.get('ASSETS','[]'))
          if not assets:sys.exit('Attach at least one program file to the release')
          print('Release metadata validated:',expected)
          PY
