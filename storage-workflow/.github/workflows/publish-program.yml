name: Publish Staged Program
on:
  push:
    branches: [main]
    paths:
      - 'incoming/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: program-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish staged archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish.py
      - name: Remove staged files from latest branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -d incoming ]; then
            git rm -r -f incoming
            git diff --cached --quiet || (git commit -m 'Clean published staging files' && git push origin main)
          fi
