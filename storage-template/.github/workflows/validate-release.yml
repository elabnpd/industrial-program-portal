name: Validate program release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release metadata and archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess,sys,pathlib
          tag=os.environ['TAG']
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]*-\d+W\d+S-(?:HMI|PLC)-v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?',tag),f'Invalid tag: {tag}'
          assert os.environ['BODY'].strip(),'Upload comments are required'
          import json
          result=subprocess.run(['gh','release','view',tag,'--repo',os.environ['REPO'],'--json','assets'],capture_output=True,text=True,check=True)
          assets=json.loads(result.stdout)['assets']
          assert len(assets)==1,'Exactly one archive is required'
          name=assets[0]['name']
          assert re.search(r'\.(zip|rar|7z|tar|tar\.gz|tgz)$',name,re.I),f'Unsupported archive: {name}'
          print('Release metadata and archive filename valid:',tag,name)
          PY
